<div class="register-container">
  <div class="register-branding">
    <i class="pi pi-code"></i>
    <h1>Assessment Platform</h1>
  </div>

  <p-card [style]="{ width: '420px' }">
    <ng-template pTemplate="header">
      <div class="card-header">
        <h2>Registro</h2>
      </div>
    </ng-template>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="flex flex-column gap-3">
        <div class="flex flex-column gap-1">
          <label for="nombreCompleto">Nombre completo</label>
          <input pInputText id="nombreCompleto" formControlName="nombreCompleto" placeholder="Tu nombre completo" class="w-full" />
        </div>
        <div class="flex flex-column gap-1">
          <label for="email">Correo electrónico</label>
          <input pInputText id="email" formControlName="email" placeholder="correo@ejemplo.com" class="w-full" />
        </div>
        <div class="flex flex-column gap-1">
          <label for="username">Usuario</label>
          <input pInputText id="username" formControlName="username" placeholder="Nombre de usuario" class="w-full" />
        </div>
        <div class="flex flex-column gap-1">
          <label for="password">Contraseña</label>
          <p-password id="password" formControlName="password" [toggleMask]="true"
            styleClass="w-full" inputStyleClass="w-full" placeholder="Mínimo 6 caracteres"></p-password>
        </div>
        @if (errorMessage) {
          <p-message severity="error" [text]="errorMessage"></p-message>
        }
        <p-button type="submit" label="Registrarse" icon="pi pi-user-plus" [loading]="loading"
          [disabled]="registerForm.invalid" styleClass="w-full"></p-button>
        <div class="text-center">
          <a routerLink="/auth/login" class="text-primary">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
      </div>
    </form>
  </p-card>
</div>
