<div class="login-container">
  <div class="login-branding">
    <i class="pi pi-code"></i>
    <h1>Assessment Platform</h1>
  </div>

  <p-card [style]="{ width: '420px' }">
    <ng-template pTemplate="header">
      <div class="card-header">
        <h2>Iniciar Sesión</h2>
      </div>
    </ng-template>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="flex flex-column gap-3">
        <div class="flex flex-column gap-1">
          <label for="username">Usuario</label>
          <input pInputText id="username" formControlName="username" placeholder="Ingresa tu usuario" class="w-full" />
        </div>
        <div class="flex flex-column gap-1">
          <label for="password">Contraseña</label>
          <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="false"
            styleClass="w-full" inputStyleClass="w-full" placeholder="Ingresa tu contraseña"></p-password>
        </div>
        @if (errorMessage) {
          <p-message severity="error" [text]="errorMessage"></p-message>
        }
        <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" [loading]="loading"
          [disabled]="loginForm.invalid" styleClass="w-full"></p-button>
        <div class="text-center">
          <a routerLink="/auth/register" class="text-primary">¿No tienes cuenta? Regístrate</a>
        </div>
      </div>
    </form>
  </p-card>
</div>
