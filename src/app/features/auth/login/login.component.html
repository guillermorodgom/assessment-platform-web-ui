<div class="auth-container">
  <div class="auth-card">
    <div class="auth-accent-bar"></div>

    <div class="auth-brand">
      <div class="brand-icon">
        <i class="pi pi-code"></i>
      </div>
      <h1>Assessment Platform</h1>
      <p class="auth-subtitle">Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label for="username">Usuario</label>
        <input pInputText id="username" formControlName="username" placeholder="Ingresa tu usuario" class="w-full" />
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="false"
          styleClass="w-full" inputStyleClass="w-full" placeholder="Ingresa tu contraseña"></p-password>
      </div>

      @if (errorMessage) {
        <p-message severity="error" [text]="errorMessage"></p-message>
      }

      <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" [loading]="loading"
        [disabled]="loginForm.invalid" styleClass="w-full auth-btn"></p-button>

      <div class="auth-link">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/auth/register">Regístrate</a>
      </div>
    </form>
  </div>
  <span class="auth-credit">by guillermorod v0.0.3</span>
</div>
